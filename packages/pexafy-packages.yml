method: searched
source: >-
  registry.npmjs.org, pypi.org/pypi/<pkg>/json, api.github.com/users/Pexafy/repos, and the
  provider's own repo READMEs / pyproject.toml
note: >-
  Pexafy publishes one client library and it is Python only. npm, RubyGems, crates.io,
  Packagist, NuGet, Maven Central and pkg.go.dev carry nothing under "pexafy" — the JS/TS,
  Go and Ruby surfaces do not exist, so an integrator on those stacks calls the REST API
  directly. Three first-party repos exist in the GitHub org; only one of them ships to a
  package registry.
