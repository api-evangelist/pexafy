notes:
- Every plan, Free included, gets the full filter set — the pricing FAQ states advanced filters require no upgrade.
- Enriched API response fields are plan-gated: Free and Starter get the core response shape, Pro and above unlock 6 enriched fields. A 403 PLAN_RESTRICTION is the error an agent sees when it asks for a field its plan does not carry.
- Anonymous access exists inside the product as a limited preview mode and is explicitly NOT a billable tier.
- The api-onboarding descriptor publishes the same seven tiers machine-readably, which is unusual — the plan ladder is agent-readable without scraping the pricing page.
gaps:
- No overage pricing published: the page never says whether exceeding the monthly quota throttles, blocks, or bills.
- No published SLA document behind the Enterprise tier's "SLA" claim.
