contract_drift:
  finding: >-
    The two first-party OpenAPI documents describe materially different APIs, and the
    richer one is not the one served.
  detail:
  - The served https://api.pexafy.com/openapi.json is the raw FastAPI auto-generated schema — machine-generated operationIds (search_photos_api_v1_search_photos_get), 20 operations, no examples, no x-extensible-enum, and only 200/201/422 responses.
  - The versioned https://github.com/Pexafy/pexafy-openapi/blob/main/openapi/v1.json is hand-maintained — clean operationIds (searchPhotos), 80 examples, 6 x-extensible-enum markers, and full 400/401/403/404/422/429/500 coverage.
  - They also disagree on the surface itself. The versioned description puts image search at POST /search/photos/by-image; the live host serves POST /api/v1/search/photos and returns nothing at a by-image path. The versioned description omits the four usage endpoints and /facets/photographers/{username} that the live host serves.
  consequence: >-
    A consumer generating a client from the published, richer description will call an
    endpoint that does not exist; a consumer generating from the served schema gets no
    error model. Both documents are Pexafy's, both are current, and neither is marked as
    superseding the other.
  recommendation: Serve the versioned description at api.pexafy.com/openapi.json, or state which of the two is normative.
