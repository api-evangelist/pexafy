versioning:
  scheme: uri-path
  current: v1
  description_version: 1.3.0
  description_versioning: semver, applied to the OpenAPI DESCRIPTION rather than to the URI
  docs: https://github.com/Pexafy/pexafy-openapi
  note: >-
    Two version numbers coexist and mean different things. The URI is pinned at /api/v1 and
    the live schema's info.version reads "v1.0.0". The pexafy-openapi repo separately
    versions the DESCRIPTION (1.1.0 -> 1.2.0 -> 1.3.0), keeps every published version under
    openapi/releases/, and ships the differ at the same version number "so that a pinned
    version of the package always understands the description it was released beside".
  published_releases:
  - 1.1.0
  - 1.2.0
  - 1.3.0
  release_archive: https://github.com/Pexafy/pexafy-openapi/tree/main/openapi/releases
deprecation:
  policy_url: https://github.com/Pexafy/pexafy-openapi
  policy_kind: breaking-change classification + accepted-breakage waivers
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  note: >-
    There is no RFC 8594 Sunset/Deprecation header support and no dated deprecation
    calendar, but there IS a real, unusually specific breaking-change policy — and it is
    executable rather than prose. The pexafy-openapi tool classifies every diff by
    request-vs-response variance (adding an enum value is additive in a request and
    breaking in a response), gates a release against a baseline, and records accepted
    breakage in waivers.json with a reason and an expiry date. One waiver is open:
    enum.value.added on /components/schemas/Source, expiring 2027-08-01, for the wikimedia
    value added in 1.3.0 — announced one release ahead in the 1.2.0 notes. Consumers are
    given x-extensible-enum (since 1.2.0) so a generator can emit an open type.
  breaking_changes_recorded:
  - version: 1.3.0
    change: Source enum gained "wikimedia"
    class: breaking (response position)
    announced_in: 1.2.0 release notes
    waiver_expires: '2027-08-01'
  - version: 1.3.0
    change: per_page default moved from 24 to 20
    class: notable — no wire-contract change, but every caller who never set per_page gets a different page size
