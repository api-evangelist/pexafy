domain_standards:
- id: tdmrep
  name: TDM Reservation Protocol (W3C CG / EU DSM Directive Art. 4)
  conforms: true
  evidence: >-
    https://pexafy.com/.well-known/tdmrep.json returns a 24-entry array — tdm-reservation 0
    on the site root, tdm-reservation 1 with tdm-policy https://pexafy.com/legal/licenses/
    on /photos/ and each of its 22 localised variants.
  why_it_matters: >-
    This is the domain standard for Pexafy's actual market. A stock-photo aggregator's
    product IS a rights-bearing image catalogue, and TDMRep is the machine-readable way a
    rights holder reserves text-and-data-mining rights per URL prefix. A buyer whose crawler
    already reads TDMRep gets the reservation for free; one that does not needs a bilateral
    agreement.
  spec_location: /.well-known/tdmrep.json
- id: content-signal
  name: Content Signals (robots.txt Content-Signal directive)
  conforms: true
  evidence: >-
    https://pexafy.com/robots.txt carries per-agent Content-Signal directives —
    search=yes,ai-input=yes,ai-train=yes for the default group and Applebot-Extended /
    meta-externalagent / meta-webindexer / Amzn-SearchBot, and search=yes,ai-input=yes,
    ai-train=no for OAI-SearchBot, Claude-SearchBot, PerplexityBot, Applebot and
    DuckAssistBot. https://docs.pexafy.com/robots.txt declares ai-train=yes for the docs.
  why_it_matters: >-
    Two hosts, two deliberately different AI-usage postures — training allowed on the
    developer docs, reserved on the image catalogue — expressed in the format crawlers read
    rather than in prose.
  spec_location: /robots.txt
- id: api-onboarding-aod
  name: API Onboarding Descriptor (aod 0.1)
  conforms: true
  evidence: >-
    https://pexafy.com/.well-known/api-onboarding returns aod 0.1 with maturity self-serve,
    account.agentPolicy allowed, all seven plans, the registration mechanism, the
    authentication method (header-env x-api-key / PEXAFY_API_KEY), the credential rotation
    route, the scope/role model, a three-step executable first-run flow (probe -> search ->
    usage), economics, and an honest `gaps` array.
  why_it_matters: >-
    Machine-readable onboarding is rare — the whole path from "no account" to "first
    authenticated call" is expressed as data, including the admission that there is no
    programmatic key-issuance endpoint.
  spec_location: /.well-known/api-onboarding
