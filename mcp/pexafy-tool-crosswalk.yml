note: >-
  The MCP server is generated from the Pexafy OpenAPI spec by fastmcp, so every tool has a
  backing REST operation and the binding is exact rather than semantic. What the crosswalk
  actually exposes is the OPPOSITE divergence: 17 of the 20 REST operations have no tool at
  all, because the server deliberately publishes a read-only three-tool surface.
